<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | LearnHub</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js" defer></script>
</head>
<body>

<div id="header-placeholder"></div>

<section class="contact-section" style="padding-top: 15rem; padding-bottom: 5rem; text-align: center;">
    <div class="section-header">
        <h2 style="font-size: 3rem;">Get in <span style="color:var(--primary-color)">Touch</span></h2>
        <p style="color:var(--text-muted); margin-top: 2rem;">Have questions? Our team is here to help you.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 4rem; margin-top: 4rem; padding: 0 5%;">
        
        <div class="glass-container" style="max-width: 500px; width: 100%; text-align: left;">
            <h3>Send a Message</h3>
            <p style="color:var(--text-muted); margin-bottom: 2rem;">We typically respond within 24 hours.</p>
            <form action="#">
                <input type="text" placeholder="Your Name" required style="width:100%; padding:1rem; margin-bottom:1.25rem; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:12px; color:white;">
                <input type="email" placeholder="Your Email" required style="width:100%; padding:1rem; margin-bottom:1.25rem; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:12px; color:white;">
                <textarea placeholder="How can we help?" style="width:100%; height:150px; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border); border-radius:12px; color:white; padding:1rem; outline:none; margin-bottom:1.25rem;"></textarea>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
        </div>

        <div style="text-align: left; max-width: 350px;">
            <div style="margin-bottom: 3rem;">
                <h3 style="margin-bottom: 0.5rem; color:var(--primary-color);">Our Location</h3>
                <p style="color:var(--text-muted);">Learner Street, Tech Valley, CA 94043</p>
            </div>
            <div style="margin-bottom: 3rem;">
                <h3 style="margin-bottom: 0.5rem; color:var(--primary-color);">Call Us</h3>
                <p style="color:var(--text-muted);">+1 (555) 123-4567</p>
            </div>
            <div style="margin-bottom: 3rem;">
                <h3 style="margin-bottom: 0.5rem; color:var(--primary-color);">Email Support</h3>
                <p style="color:var(--text-muted);">support@learnhub.com</p>
            </div>
        </div>

    </div>
</section>

<div id="footer-placeholder"></div>

</body>
</html>
